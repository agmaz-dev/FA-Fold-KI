name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk FoldKI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FoldKI-apk
          path: FoldKI.apk

      - name: Publish as GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Fold KI APK (Build ${{ github.run_number }})
          body: "APK zum direkten Installieren auf Android. Branch: ${{ github.ref_name }}"
          files: FoldKI.apk
          make_latest: true
